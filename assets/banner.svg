<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="50%" stop-color="#0e1326" />
      <stop offset="100%" stop-color="#161233" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="subtext-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Center Protective Backdrop -->
    <radialGradient id="center-darkener" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a0e1e" stop-opacity="0.92" />
      <stop offset="65%" stop-color="#0a0e1e" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0a0e1e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .title-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 700;
      font-size: 19px;
      fill: url(#subtext-grad);
      letter-spacing: 0.5px;
    }
    .tagline-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 500;
      font-size: 14px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }

    /* Dynamic Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-25px, 25px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 60; }
    }
    @keyframes particleDrift {
      0% { transform: translateY(0); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(-40px); opacity: 0.2; }
    }

    .pulse-node { animation: pulseGlow 4s infinite ease-in-out; transform-origin: center; }
    .floating-orb-1 { animation: floatOrb1 7s infinite ease-in-out; }
    .floating-orb-2 { animation: floatOrb2 8s infinite ease-in-out; }
    .animated-dash { stroke-dasharray: 6 6; animation: dashMove 3s linear infinite; }
    .drift-p1 { animation: particleDrift 5s infinite ease-in-out; }
    .drift-p2 { animation: particleDrift 6s infinite ease-in-out 1.5s; }
    .drift-p3 { animation: particleDrift 5.5s infinite ease-in-out 3s; }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />

  <!-- Grid Tech Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Ambient Dynamic Glowing Nebula Spheres (Background) -->
  <g class="floating-orb-1">
    <circle cx="160" cy="90" r="130" fill="#6366f1" opacity="0.22" filter="url(#glow-heavy)" />
    <circle cx="1060" cy="270" r="140" fill="#ec4899" opacity="0.20" filter="url(#glow-heavy)" />
  </g>
  <g class="floating-orb-2">
    <circle cx="1020" cy="80" r="120" fill="#06b6d4" opacity="0.22" filter="url(#glow-heavy)" />
    <circle cx="140" cy="280" r="130" fill="#a855f7" opacity="0.20" filter="url(#glow-heavy)" />
  </g>

  <!-- Floating Dynamic Particle Dots -->
  <g class="drift-p1">
    <circle cx="210" cy="180" r="2.5" fill="#38bdf8" />
    <circle cx="980" cy="150" r="3" fill="#ec4899" />
  </g>
  <g class="drift-p2">
    <circle cx="320" cy="240" r="2" fill="#a855f7" />
    <circle cx="880" cy="220" r="2.5" fill="#67e8f9" />
  </g>
  <g class="drift-p3">
    <circle cx="150" cy="130" r="3" fill="#f43f5e" />
    <circle cx="1050" cy="180" r="2" fill="#818cf8" />
  </g>

  <!-- Dynamic Connecting Network Circuit (Left & Right Flanks) -->
  <g stroke="#6366f1" stroke-width="1.5" opacity="0.35">
    <!-- Left Network Flow -->
    <line x1="70" y1="180" x2="170" y2="120" class="animated-dash" />
    <line x1="170" y1="120" x2="230" y2="200" />
    <line x1="170" y1="120" x2="200" y2="60" />
    <circle cx="70" cy="180" r="4" fill="#6366f1" />
    <circle cx="170" cy="120" r="6" fill="#a855f7" class="pulse-node" />
    <circle cx="230" cy="200" r="4.5" fill="#38bdf8" />
    <circle cx="200" cy="60" r="3.5" fill="#ec4899" />

    <!-- Right Network Flow -->
    <line x1="1130" y1="180" x2="1030" y2="120" class="animated-dash" />
    <line x1="1030" y1="120" x2="970" y2="200" />
    <line x1="1030" y1="120" x2="1000" y2="60" />
    <circle cx="1130" cy="180" r="4" fill="#06b6d4" />
    <circle cx="1030" cy="120" r="6" fill="#ec4899" class="pulse-node" />
    <circle cx="970" cy="200" r="4.5" fill="#818cf8" />
    <circle cx="1000" cy="60" r="3.5" fill="#a855f7" />
  </g>

  <!-- Central Protective Radial Shield (Guarantees Title & Subtitle Legibility in Foreground) -->
  <ellipse cx="600" cy="180" rx="440" ry="145" fill="url(#center-darkener)" />

  <!-- Outer Border Frame with Gradient Stroke -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="url(#primary-grad)" stroke-width="2" opacity="0.65" />

  <!-- FOREGROUND TEXT AND BADGES -->
  <g text-anchor="middle">
    <!-- Category Pill Tag -->
    <g transform="translate(600, 52)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
      <text x="0" y="4" class="pill-text" fill="#c7d2fe">⚡ CURATED LLM &amp; PROMPT STACK ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="126" class="title-text">
      Awesome Prompt Management &amp; Engineering
    </text>

    <!-- Subtitle -->
    <text x="600" y="172" class="subtitle-text">
      Prompt Versioning • Evaluations • LLMOps • Observability • CI/CD
    </text>

    <!-- Descriptive Tagline -->
    <text x="600" y="206" class="tagline-text">
      Comprehensive architectural guide to commercial enterprise platforms and production open-source tools
    </text>

    <!-- Interactive / Status Pills -->
    <g transform="translate(600, 268)">
      <!-- Pill 1: Versioning -->
      <g transform="translate(-320, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
        <text x="0" y="5" class="pill-text">Prompt Registry</text>
      </g>

      <!-- Pill 2: Evals -->
      <g transform="translate(-160, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
        <text x="0" y="5" class="pill-text">Automated Evals</text>
      </g>

      <!-- Pill 3: Tracing -->
      <g transform="translate(0, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
        <text x="0" y="5" class="pill-text">LLM Tracing &amp; Logs</text>
      </g>

      <!-- Pill 4: Red Teaming -->
      <g transform="translate(160, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" stroke="#06b6d4" stroke-width="1.2" />
        <text x="0" y="5" class="pill-text">Red Teaming</text>
      </g>

      <!-- Pill 5: Open-Source -->
      <g transform="translate(320, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
        <text x="0" y="5" class="pill-text">100% Open Source</text>
      </g>
    </g>

    <!-- Bottom Footer Timestamp Notice -->
    <text x="600" y="326" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#64748b" letter-spacing="1">
      OCTOBER 2026 EDITION • COMMUNITY CURATED • APACHE &amp; MIT ECOSYSTEM
    </text>
  </g>
</svg>
